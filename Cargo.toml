[package]
name = "gecko-sim"
version = "0.3.0"
edition = "2024"
description = "A fast emulator for the Gecko5 board (RV32I), native and in the browser"
license = "MIT"
repository = "https://github.com/leodgn/gecko-sim"

[dependencies]
eframe = "0.35.0"
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# To call web/assemble.js from Rust (src/assembler/web.rs).
wasm-bindgen = "0.2"
js-sys = "0.3"
# std::time::Instant panics in the browser; web-time provides a working one.
web-time = "1"

# The web module's logic is also tested natively (`cargo test`), so its
# web-only imports must resolve there too. On native, web-time is just std.
[dev-dependencies]
web-time = "1"
