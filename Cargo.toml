[package]
name = "gecko-sim"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# std::time::Instant panics in the browser; web-time provides a working one.
web-time = "1"
